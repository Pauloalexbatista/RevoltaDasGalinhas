<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>A Revolta das Galinhas (Arcade Retro 1984)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="arcade-cabinet">
    <!-- Top Bezel / Header -->
    <div id="rotate-hint" class="rotate-hint">
      <span>🔄 RODA NA HORIZONTAL PARA ECRÃ CHEIO</span>
      <button id="btn-close-hint" type="button">✕</button>
    </div>
    <header id="arcade-header">
      <div class="logo">🐔 A REVOLTA DAS GALINHAS</div>
      <div class="subtitle">TRIBUTO AOS JOGOS ARCADE (1984)</div>
    </header>
        <!-- High Score Input Modal (Desktop & Mobile 100% Reliable) -->
    <div id="highscore-modal" class="highscore-modal hidden">
      <div class="hs-card">
        <div class="hs-header">🏆 NOVO RECORDE! 🏆</div>
        <div id="hs-score-text" class="hs-score">000000</div>
        <p class="hs-sub">DIGITA O TEU NOME / INICIAIS:</p>
        <div class="hs-input-row">
          <input id="hs-input" type="text" maxlength="8" placeholder="TEU NOME" autocomplete="off" autocapitalize="characters">
          <button id="hs-submit-btn" type="button">GRAVAR RECORDE</button>
        </div>
      </div>
    </div>
    <input id="mobile-name-input" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" style="position: absolute; opacity: 0; pointer-events: none; left: -9999px;">

    <!-- Main Screen Area with Scanlines & CRT curvature -->
    <div id="screen-wrapper" class="crt-screen">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      <div class="scanlines"></div>
      <div class="crt-glow"></div>
    </div>

    <!-- On-screen Virtual Mobile Controls (Landscape Ergonomic Layout) -->
    <div id="touch-controls">
      <!-- Left Thumb: Arcade Analog Joystick -->
      <div id="joystick-zone" class="joystick-zone">
        <div id="joystick-base" class="joystick-base">
          <div class="joystick-cross">
            <span class="j-dir j-up">▲</span>
            <span class="j-dir j-right">►</span>
            <span class="j-dir j-down">▼</span>
            <span class="j-dir j-left">◄</span>
          </div>
          <div id="joystick-stick" class="joystick-stick"></div>
        </div>
      </div>

      <!-- Right Thumb: Jump Action -->
      <div class="touch-cluster touch-right">
        <button id="btn-jump" class="action-btn jump" aria-label="Saltar">
          <span>SALTAR</span>
        </button>
      </div>
    </div>

    <!-- Arcade Footer / Instructions -->
    <footer id="arcade-footer">
      <div class="control-hints">
        <span><strong>TECLADO:</strong> [O/P] ou [◄/►] Mover | [Q/A] ou [▲/▼] Escadas | [ESPAÇO] Saltar | [I] Instruções</span>
        <div class="footer-buttons">
          <button id="btn-menu-toggle" class="retro-btn">🏠 MENU</button>
          <button id="btn-instr-toggle" class="retro-btn">📖 INSTRUÇÕES</button>
          <button id="btn-sound-toggle" class="retro-btn">🔊 SOM: ON</button>
          <button id="btn-crt-toggle" class="retro-btn">📺 CRT: ON</button>
        </div>
      </div>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
